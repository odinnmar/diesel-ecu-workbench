name: Build and publish Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workbench-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Select next available release version
        shell: pwsh
        run: node .github/scripts/next-version.cjs

      - name: Build and publish installer with latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win

      - name: Verify published updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$v"
          gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | Tee-Object -Variable assets
          if (-not ($assets -match 'latest.yml')) { throw "Missing latest.yml in $tag" }
          if (-not ($assets -match '\.exe$')) { throw "Missing Windows installer in $tag" }
