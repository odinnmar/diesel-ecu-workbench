name: Build and publish Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workbench-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Select next release version
        run: node .github/scripts/next-version.cjs

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          $exe = Get-ChildItem release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows installer was not generated" }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA512).Hash
          $bytes = [Convert]::FromHexString($hash)
          $sha512 = [Convert]::ToBase64String($bytes)
          $size = $exe.Length
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          @"
          version: $version
          files:
            - url: $($exe.Name)
              sha512: $sha512
              size: $size
          path: $($exe.Name)
          sha512: $sha512
          releaseDate: '$date'
          "@ | Set-Content release/latest.yml -Encoding utf8

          Get-Content release/latest.yml

      - name: Create and push release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release create $tag --repo "${{ github.repository }}" --title "Diesel ECU Workbench $version" --notes "Diesel ECU Workbench $version for Windows."

      - name: Upload installer and updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $exe = Get-ChildItem release -Filter "*.exe" | Select-Object -First 1
          $blockmap = Get-ChildItem release -Filter "*.exe.blockmap" | Select-Object -First 1
          if (-not $exe) { throw "Installer missing" }
          if (-not (Test-Path release/latest.yml)) { throw "latest.yml missing" }
          $files = @($exe.FullName, "release/latest.yml")
          if ($blockmap) { $files += $blockmap.FullName }
          gh release upload $tag $files --repo "${{ github.repository }}" --clobber

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = gh release view $tag --repo "${{ github.repository }}" --json assets --jq ".assets[].name"
          $assets
          if (-not ($assets -match "latest.yml")) { throw "Missing latest.yml" }
          if (-not ($assets -match "\.exe$")) { throw "Missing Windows installer" }
